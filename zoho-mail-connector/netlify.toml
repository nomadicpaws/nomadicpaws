[build]
  publish = "public"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/.well-known/oauth-authorization-server"
  to = "/.netlify/functions/zoho-connector?route=oauth-authorization-server"
  status = 200

[[redirects]]
  from = "/.well-known/oauth-protected-resource"
  to = "/.netlify/functions/zoho-connector?route=oauth-protected-resource"
  status = 200

[[redirects]]
  from = "/oauth/*"
  to = "/.netlify/functions/zoho-connector?route=oauth/:splat"
  status = 200

[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/zoho-connector?route=mcp"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-store"
    Content-Security-Policy = "default-src 'none'; style-src 'unsafe-inline'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
