<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#fdfaf5">
  <title>Nomadic Paws Admin — Preview</title>
  <link rel="stylesheet" href="/app-preview/preview.css">
</head>
<body>
  <header><img src="/apple-touch-icon.png" alt=""><div><strong>Nomadic Paws</strong><span>Admin preview</span></div><b>CONCEPT</b></header>
  <main>
    <p class="eyebrow">PINTEREST WORKSPACE</p>
    <h1>Build a beautiful campaign.</h1>
    <p class="intro">Choose the story once, then prepare all four Pins without opening the article editor.</p>

    <section>
      <label>TRAIL JOURNAL STORY</label>
      <button class="story-trigger" id="storyTrigger"><span><strong id="selectedTitle">Choose a story</strong><small id="selectedMeta">Drafts and scheduled stories appear here</small></span><i>⌄</i></button>
      <div class="story-list" id="storyList">
        <button data-title="What We Pack for a Hike With Our Cat" data-meta="Draft · Aug 30, 2026"><strong>What We Pack for a Hike With Our Cat</strong><small>Draft · Aug 30, 2026</small></button>
        <button data-title="Why Pezzy Is at the Top of Cheeto’s Treat List" data-meta="Scheduled · Sep 6, 2026"><strong>Why Pezzy Is at the Top of Cheeto’s Treat List</strong><small>Scheduled · Sep 6, 2026</small></button>
        <button data-title="When to End a Cat Hike: Who’s Actually Leading?" data-meta="Published · Aug 23, 2026"><strong>When to End a Cat Hike: Who’s Actually Leading?</strong><small>Published · Aug 23, 2026</small></button>
      </div>
    </section>

    <section class="pin-card" id="pinCard">
      <div class="pin-heading"><h2>Pin 1</h2><span>RSS · within 24 hours</span></div>
      <div class="pin-preview">
        <img class="photo" src="/images/hero/cheeto-desert-sunset-mobile-720.jpg" alt="Cheeto in the desert">
        <img class="logo small left" id="logo" src="/images/pinterest-logos/logo-bark.png" alt="Nomadic Paws logo">
      </div>
      <label>LOGO COLOR</label><div class="choices" data-control="color">
        <button class="active" data-value="bark">Bark</button><button data-value="sage">Sage</button><button data-value="sand">Cream</button><button data-value="terracotta">Terracotta</button>
      </div>
      <label>LOGO SIZE</label><div class="choices" data-control="size"><button class="active" data-value="small">Small</button><button data-value="medium">Medium</button></div>
      <label>LOGO PLACEMENT</label><div class="choices" data-control="side"><button class="active" data-value="left">Left</button><button data-value="right">Right</button></div>
    </section>
    <button class="save">Save Pinterest campaign</button>
    <p class="note">Visual preview only — this page does not publish or change website content.</p>
  </main>
  <nav><button onclick="location.href='/app-preview/today.html'">Today</button><button>Studio</button><button>Journal</button><button class="active">Pinterest</button><button>Register</button></nav>
  <script src="/app-preview/preview.js"></script>
</body>
</html>
