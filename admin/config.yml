backend:
  name: git-gateway
  branch: main

site_url: https://nomadicpaws.co
display_url: https://nomadicpaws.co

editor:
  preview: false

media_folder: images
public_folder: /images

collections:
  - name: blog
    label: Trail Journal
    label_singular: Journal Entry
    description: Draft, schedule, and publish Trail Journal stories.
    folder: _posts
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} — {{date}}"
    sortable_fields: [date, title]
    view_filters:
      - { label: Drafts, field: draft, pattern: true }
      - { label: Ready or published, field: draft, pattern: false }
    fields:
      - { label: Cover image, name: image, widget: image, required: false, hint: "Choose the hero image readers will see first. iPhone photos are prepared automatically." }
      - { label: Cover image description, name: image_alt, widget: string, required: false, hint: "Describe what is visible in the cover image for screen readers and search engines. Example: Cheeto wearing a harness on a Tucson desert trail." }
      - { label: Title, name: title, widget: string }
      - { label: Subtitle / excerpt, name: description, widget: text, required: false, hint: "The short introduction shown with the story and used as its search description." }
      - { label: Category, name: category, widget: select, options: [Trail Reports, Cheeto Diaries, Gear, Tips] }
      - { label: Publishing status — Keep as draft, name: draft, widget: boolean, default: true, required: false, hint: "ON = Draft: safely hidden and will not publish. OFF + a future date = Scheduled. OFF + the current or a past date = Published." }
      - { label: Publish date and time, name: date, widget: datetime, hint: "For a draft, this date does not publish anything. To schedule, choose a future date and turn Keep as draft OFF. To publish now, choose now and turn Keep as draft OFF." }
      - { label: Article body, name: body, widget: markdown, hint: "Write or dictate the story here. Add a photo at the cursor with the image option in the + menu." }
