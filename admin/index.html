<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#6f7e62" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Nomadic Paws" />
    <link rel="manifest" href="/admin/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Trail Journal — Nomadic Paws</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/admin/admin.css?v=7" />

    <!-- Netlify Identity widget (load in head so it can handle invite/login handoff) -->
    <script
      src="https://unpkg.com/netlify-identity-widget@1.9.2/build/netlify-identity-widget.js"
      integrity="sha384-dy2tW8xkhLIj8lZR42MCwZhhDb2cCewZiw0uA65CMpdHiJzL+iubx7HzHcCXU2rW"
      crossorigin="anonymous"></script>
  </head>
  <body>
    <noscript>
      Please enable JavaScript to use the content editor.
    </noscript>

    <!-- Initialize Netlify Identity safely (avoid double init) -->
    <script>
      (function () {
        if (window.netlifyIdentity && !window.netlifyIdentity.__np_inited) {
          try {
            window.netlifyIdentity.init();
          } catch (e) {
            // ignore
          }
          window.netlifyIdentity.__np_inited = true;

          // Keep users on /admin after login
          if (window.netlifyIdentity.on) {
            window.netlifyIdentity.on('login', function () {
              if (location.pathname !== '/admin/' && location.pathname !== '/admin') {
                location.href = '/admin/';
              }
            });
          }
        }
      })();
    </script>

    <!-- Decap CMS (load at end of body so it can mount into the DOM) -->
    <script
      src="https://unpkg.com/decap-cms@3.15.1/dist/decap-cms.js"
      integrity="sha384-in6eHztHveqQ7uMZ1fDaKlDmacQLFuLH2wWrFTiymyuS8zQ5bixwL8U3AeRi8h/L"
      crossorigin="anonymous"></script>
    <script src="/admin/review-utils.js"></script>
    <script src="/admin/photo-utils.js"></script>
    <script src="/admin/pinterest-preview.js?v=5"></script>
    <script src="/admin/app.js?v=5" defer></script>
  </body>
</html>
